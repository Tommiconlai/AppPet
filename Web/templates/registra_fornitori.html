<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <!--link rel="stylesheet" href="style.css"-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style_attività.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            align-items: top;
            height: 100vh;
            background-color: #f4f4f4;
            margin-top: 0vh;
            overflow-x: hidden;
        }

        .immagineSopra {
            position: absolute;
            margin-top: -13cap;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background-color: #007bff;
            width: 150%;
            height: 30%;
            border-radius: 50%;
        }

        .main-container {
            background-color: #fff;
            width: 400px;
            margin: auto;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .main-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group label {
            text-align: left;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .registra-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .registra-button:hover {
            background-color: #218838;
        }

        .inside-container{
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>

<header>

</header>

<body>

    <h2>Registrazione</h2>

    <div class="immagineSopra"></div>


    <div class="main-container">
        <form method="POST" action="/registra_fornitori">
            <div class="form-group">
                <div class="inside-container">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome" required>
                </div>

                <div class="inside-container">
                    <label for="cognome">Cognome:</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Cognome" required>
                </div>

                <div class="inside-container">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" placeholder="Email" required>
                </div>

                <div class="inside-container">
                    <label for="telefono">Telefono:</label>
                    <input type="text" id="telefono" name="telefono" placeholder="Telefono" required>
                </div>

                <div class="inside-container">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <div class="inside-container">
                    <label for="password_check">Conferma password:</label>
                    <input type="password" id="password_check" name="password_check" placeholder="Conferma Password" required>
                </div>

                <input type="submit" value="Registrati" class="registra-button">


            </div>
        </form>
    </div>


</html>
