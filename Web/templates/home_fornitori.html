<body>
    {% if listautenti %}
    <table>
    <tr>
    <th>Id</th>
    <th>Nome</th>
    <th>Cognome</th>
    <th>Età</th>
    </tr>
    {% for utente in listautenti %}
    <tr>
    <td>{{ utente.id }}</td>
    <td>{{ utente.nome }}</td>
    <td>{{ utente.cognome }}</td>
    <td>{{ utente.eta }}</td>
    </tr>
    {% endfor %}
    </table>
    {% endif %}
    
    </body>
