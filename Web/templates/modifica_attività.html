<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{attività.nome}}</title>
</head>
<body>
    <form method="POST" action="/modifica_attività">
        <div class="container">
            <label for="nome">Nome attività:</label>
            <input type="text" id="nome" name="nome" placeholder='{{attività.nome}}' required><br>

            <label for="tipo_attività">Tipo attività:</label>
            {% for categoria in tipoAttività %}
                <input type="radio" value={{categoria.id}} name="tipo_attività">
                {{categoria.nome}}</input>
            {% endfor %}
            <br>

            <label for="indirizzo">indirizzo:</label>
            <input type="text" id="indirizzo" name="indirizzo" placeholder={{attività.indirizzo}}><br>

            <label for="cap">CAP:</label>
            <input type="text" id="cap" name="cap" placeholder="CAP" required><br>

            <label for="orario">orario:</label>
            <input type="text" id="orario" name="orario" placeholder="Orario"><br>

            <input type="submit" value="Get started!">
            
        </div>
    </form>


</body>
</html>
